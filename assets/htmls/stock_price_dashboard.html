<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* set up font-family for the dashboard */
        body {
            font-family: Helvetica, Arial, sans-serif;
        }

        #selected-date-range {
            background-color: white; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
    <title>Stock Price Dashboard</title>
</head>
<body style="margin: 50px;">
    <a href="https://www.ibm.com/us-en" style="font-size: 14px; font-weight: 300; text-decoration: none; color: rgb(67, 66, 66); margin: 10px 0px; display: inline-block;" >International Business Machines Corp. (IBM)</a>
    <h2 style="font-size: 36px;font-weight: 600; margin:0;">$309.74</h2>
    <div style="display: flex; flex-direction: row; align-items: center; width: 100%; justify-content: space-between;">
        <div style="margin-right: 40px;">
            <h3 style="font-size: 10px; font-weight: 400; color:green; margin: 10px 0px;">+$39.07 (14.46%) <span style="color: black;">Past 6 Months</span></h3>
            <h3 style="font-size: 10px; font-weight: 400; color:red; margin:10px 0px;">$307.44-$0.50(-0.16%) <span style="color: black">After Hours</span></h3>
        </div>
        <div style="display: flex; gap: 10px; list-style: none; font-size: 10px; font-weight: 400; color: #555; background-color: rgb(246, 245, 245); padding: 8px; border-radius: 10px;">
            <li style="padding: 10px 25px; border-radius: 10px;">5D</li>
            <li style="padding: 10px 25px; border-radius: 10px;">1M</li>
            <li style="padding: 10px 25px; border-radius: 10px;">3M</li>
            <li style="padding: 10px 25px; border-radius: 10px;">6M</li>
            <li id="selected-date-range" style="padding: 10px 25px; border-radius: 10px;">YTD</li>
        </div>
    </div>
    <div id="stock-line-chart">
        <!-- Load the IBM stock price chart -->
        <iframe src="ibm_stock_price_chart.html" style="border:none; width: 100%; height: 500px;"></iframe>
    </div>
</body>
</html>
